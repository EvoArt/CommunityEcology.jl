name: Documentation
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install documentation dependencies
        run: |
          git clone https://github.com/EvoArt/NonmetricMDS.jl ../NonmetricMDS.jl
          git -C ../NonmetricMDS.jl checkout b45570263269ba4111a59ae6e68966754a2e29ca
          julia --project=docs -e 'using Pkg; Pkg.develop([Pkg.PackageSpec(path="../NonmetricMDS.jl"), Pkg.PackageSpec(path=pwd())]); Pkg.instantiate()'
      - name: Build and deploy documentation
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
